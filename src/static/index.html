<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div id="user-menu">
        <button id="user-icon" aria-label="User account">👤</button>
        <div id="user-dropdown" class="hidden">
          <button id="login-button" type="button">Log in</button>
          <button id="register-button" type="button">Create student account</button>
          <button id="logout-button" type="button" class="hidden">Logout</button>
          <button id="reset-password-button" type="button" class="hidden">Reset a password</button>
          <p id="user-display" class="hidden"></p>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="admin-note" class="info">Administrator login is required to register or unregister students.</p>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <div id="login-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="modal-content">
        <h3 id="login-title">Account Login</h3>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" minlength="3" maxlength="64" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" minlength="12" maxlength="128" required />
          </div>
          <div class="modal-actions">
            <button type="submit">Login</button>
            <button type="button" id="cancel-login">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="register-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="register-title">
      <div class="modal-content">
        <h3 id="register-title">Create Student Account</h3>
        <form id="register-form">
          <div class="form-group">
            <label for="register-username">Username:</label>
            <input type="text" id="register-username" minlength="3" maxlength="64" required />
          </div>
          <div class="form-group">
            <label for="register-password">Password (at least 12 characters):</label>
            <input type="password" id="register-password" minlength="12" maxlength="128" required />
          </div>
          <div class="modal-actions">
            <button type="submit">Create Account</button>
            <button type="button" id="cancel-register">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="reset-password-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="reset-password-title">
      <div class="modal-content">
        <h3 id="reset-password-title">Reset User Password</h3>
        <form id="reset-password-form">
          <div class="form-group">
            <label for="reset-username">Username:</label>
            <input type="text" id="reset-username" minlength="3" maxlength="64" required />
          </div>
          <div class="form-group">
            <label for="new-password">New password (at least 12 characters):</label>
            <input type="password" id="new-password" minlength="12" maxlength="128" required />
          </div>
          <div class="modal-actions">
            <button type="submit">Reset Password</button>
            <button type="button" id="cancel-reset-password">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
